[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coursework"
version = "0.1.0"
description = "Masonry quantity takeoff with honest wall junction resolution"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PySide6>=6.6", "pymupdf>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "shapely>=2.0", "ruff>=0.5"]

[project.scripts]
coursework = "coursework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
